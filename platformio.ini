[platformio]
default_envs = esp32dev
src_dir = examples/RestCrud

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = symlink://.

[env:native-test]
platform = native
test_framework = googletest
lib_deps =
    symlink://.
    google/googletest
lib_compat_mode = off
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall -Wextra
    -I$PROJECT_DIR/src
    -I$PROJECT_DIR/test/support
    -I$PROJECT_DIR/test/support/stubs